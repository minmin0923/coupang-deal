name: 쿠팡 딜 봇

on:
  schedule:
    # ── UTC 기준. KST = UTC+9 ──────────────────────────────
    # 활발 시간대 KST 07:00~22:59 → 20분 간격 (하루 48회)
    - cron: "*/20 22,23,0-13 * * *"
    # 심야 시간대 KST 23:00~06:59 → 60분 간격 (하루 8회)
    - cron: "0 14-21 * * *"
    # 합계 하루 56회 ≒ 월 1,680분 (무료 2,000분의 84%)
  workflow_dispatch:
    inputs:
      mode:
        description: "실행 모드"
        required: true
        default: "selftest"
        type: choice
        options: [selftest, auto, hunt, live, test, dry]

permissions:
  contents: write

concurrency:
  group: coupang-deal
  cancel-in-progress: false      # 데일리 발송이 끊기지 않도록

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 6           # 폭주 시 사용량 방어
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip             # 설치 시간 단축 = 과금 시간 단축

      - run: pip install -q -r requirements.txt

      - name: 실행
        env:
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py "${{ inputs.mode || 'auto' }}"

      - name: 이력 커밋
        if: always()
        run: |
          git config user.name  "deal-bot"
          git config user.email "deal-bot@users.noreply.github.com"
          git add -A data/ 2>/dev/null || true
          git diff --staged --quiet || git commit -m "snapshot $(date -u +'%m-%d %H:%M')"
          git pull --rebase --autostash || true
          git push || true
