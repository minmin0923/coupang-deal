name: 쿠팡 딜 봇

on:
  schedule:
    # KST 07:10 / 12:00 / 18:00 / 22:00  (UTC = KST-9)
    - cron: "10 22 * * *"
    - cron: "0 3 * * *"
    - cron: "0 9 * * *"
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "실행 모드"
        required: true
        default: "selftest"
        type: choice
        options: [selftest, test, dry, live]

permissions:
  contents: write

concurrency:
  group: coupang-deal
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests

      - name: 실행
        env:
          COUPANG_ACCESS_KEY:  ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY:  ${{ secrets.COUPANG_SECRET_KEY }}
          NAVER_CLIENT_ID:     ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
        # 수동 실행이면 고른 모드, 스케줄이면 저장소 변수 RUN_MODE (기본 test)
        run: python main.py "${{ inputs.mode || vars.RUN_MODE || 'test' }}"

      - name: DB 커밋
        if: always()
        run: |
          git config user.name  "deal-bot"
          git config user.email "deal-bot@users.noreply.github.com"
          git add -A data/ 2>/dev/null || true
          git diff --staged --quiet || git commit -m "snapshot $(date -u +'%Y-%m-%d %H:%M')"
          git pull --rebase --autostash || true
          git push || true
